
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Beat Maker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header>
            <h1>🎵 MY BEAT MAKER</h1>
            <p>Create your own beats</p>
        </header>

        <section class="controls">
            <button id="playBtn">▶ PLAY</button>
            <button id="stopBtn">⏹ STOP</button>

            <label>
                BPM
                <input type="range" id="bpm" min="60" max="180" value="120">
                <span id="bpmValue">120</span>
            </label>
        </section>

        <section class="sequencer">

            <div class="track">
                <h2>🥁 KICK</h2>
                <div class="steps" id="kick"></div>
            </div>

            <div class="track">
                <h2>👏 CLAP</h2>
                <div class="steps" id="clap"></div>
            </div>

            <div class="track">
                <h2>🥁 SNARE</h2>
                <div class="steps" id="snare"></div>
            </div>

            <div class="track">
                <h2>🎩 HI-HAT</h2>
                <div class="steps" id="hihat"></div>
            </div>

        </section>

        <footer>
            <p>Made with 🎵 by You</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
