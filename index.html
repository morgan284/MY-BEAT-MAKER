<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Beat Maker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header>
        <h1>🎵 MY BEAT MAKER</h1>
        <p>Create your own music</p>
    </header>

    <section class="controls">

        <button id="playBtn">▶ PLAY</button>
        <button id="stopBtn">⏹ STOP</button>

        <button id="recordBtn">⏺ RECORD</button>

        <label>
            BPM
            <input type="range" id="bpm" min="60" max="180" value="120">
            <span id="bpmValue">120</span>
        </label>

    </section>

    <div id="recordingStatus"></div>

    <!-- INSTRUMENT SELECTOR -->

    <section class="instrument-panel">

        <h2>🎹 INSTRUMENTS</h2>

        <div class="instrument-buttons">

            <button class="instrument active" data-instrument="piano">
                🎹 Piano
            </button>

            <button class="instrument" data-instrument="organ">
                🎹 Organ
            </button>

            <button class="instrument" data-instrument="guitar">
                🎸 Guitar
            </button>

            <button class="instrument" data-instrument="strings">
                🎻 Strings
            </button>

            <button class="instrument" data-instrument="synth">
                🎛️ Synth
            </button>

            <button class="instrument" data-instrument="flute">
                🪈 Flute
            </button>

        </div>

    </section>


    <!-- PIANO -->

    <section class="piano-section">

        <h2>🎹 PIANO</h2>

        <div class="piano">

            <button class="key white" data-note="C4">C</button>
            <button class="key black" data-note="C#4">C#</button>

            <button class="key white" data-note="D4">D</button>
            <button class="key black" data-note="D#4">D#</button>

            <button class="key white" data-note="E4">E</button>

            <button class="key white" data-note="F4">F</button>
            <button class="key black" data-note="F#4">F#</button>

            <button class="key white" data-note="G4">G</button>
            <button class="key black" data-note="G#4">G#</button>

            <button class="key white" data-note="A4">A</button>
            <button class="key black" data-note="A#4">A#</button>

            <button class="key white" data-note="B4">B</button>

            <button class="key white" data-note="C5">C</button>

        </div>

    </section>

        <!-- YOUR EXISTING INSTRUMENT SECTION ENDS HERE -->


        <!-- CHORD MAKER -->

        <section class="music-section">

            <h2>🎼 CHORD MAKER</h2>

            <p class="hint">
                Choose a chord and add it to your music.
            </p>

            <div class="chord-buttons">

                <button class="chord" data-chord="C">C</button>
                <button class="chord" data-chord="Am">Am</button>
                <button class="chord" data-chord="F">F</button>
                <button class="chord" data-chord="G">G</button>
                <button class="chord" data-chord="Dm">Dm</button>
                <button class="chord" data-chord="Em">Em</button>

            </div>

        </section>


        <!-- BASS / 808 -->

        <section class="music-section">

            <h2>🔊 BASS & 808</h2>

            <div class="bass-controls">

                <button class="bass-note" data-note="C2">C</button>
                <button class="bass-note" data-note="D2">D</button>
                <button class="bass-note" data-note="E2">E</button>
                <button class="bass-note" data-note="F2">F</button>
                <button class="bass-note" data-note="G2">G</button>
                <button class="bass-note" data-note="A2">A</button>
                <button class="bass-note" data-note="B2">B</button>

            </div>

        </section>


        <!-- PIANO ROLL -->

        <section class="music-section">

            <h2>🎹 PIANO ROLL</h2>

            <p class="hint">
                Click the squares to create a melody.
            </p>

            <div id="pianoRoll"></div>

        </section>


        <!-- DRUMS -->

        <section class="sequencer">

            <h2 class="section-title">🥁 DRUMS</h2>    <!-- DRUMS -->

    <section class="sequencer">

        <h2 class="section-title">🥁 DRUMS</h2>

        <div class="track">
            <span>Kick</span>
            <div class="steps" id="kick"></div>
        </div>

        <div class="track">
            <span>Snare</span>
            <div class="steps" id="snare"></div>
        </div>

        <div class="track">
            <span>Clap</span>
            <div class="steps" id="clap"></div>
        </div>

        <div class="track">
            <span>Hi-Hat</span>
            <div class="steps" id="hihat"></div>
        </div>

        <div class="track">
            <span>Open Hat</span>
            <div class="steps" id="openhat"></div>
        </div>

        <div class="track">
            <span>Low Tom</span>
            <div class="steps" id="lowtom"></div>
        </div>

        <div class="track">
            <span>High Tom</span>
            <div class="steps" id="hightom"></div>
        </div>

        <div class="track">
            <span>Crash</span>
            <div class="steps" id="crash"></div>
        </div>

        <div class="track">
            <span>Ride</span>
            <div class="steps" id="ride"></div>
        </div>

        <div class="track">
            <span>Perc</span>
            <div class="steps" id="perc"></div>
        </div>

    </section>


    <footer>
        <p>Made with 🎵 by You</p>
    </footer>

</div>

<script src="script.js"></script>

</body>
</html>
