<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Beat Maker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header>
        <h1>🎵 MY BEAT MAKER</h1>
        <p>Create your own music</p>
    </header>

    <section class="controls">
        <button id="playBtn">▶ PLAY</button>
        <button id="stopBtn">⏹ STOP</button>

        <label>
            BPM
            <input type="range" id="bpm" min="60" max="180" value="120">
            <span id="bpmValue">120</span>
        </label>
    </section>

    <section class="sequencer">

        <h2 class="section-title">🥁 DRUMS</h2>

        <div class="track">
            <span>Kick</span>
            <div class="steps" id="kick"></div>
        </div>

        <div class="track">
            <span>Snare</span>
            <div class="steps" id="snare"></div>
        </div>

        <div class="track">
            <span>Clap</span>
            <div class="steps" id="clap"></div>
        </div>

        <div class="track">
            <span>Hi-Hat</span>
            <div class="steps" id="hihat"></div>
        </div>

        <div class="track">
            <span>Open Hat</span>
            <div class="steps" id="openhat"></div>
        </div>

        <div class="track">
            <span>Low Tom</span>
            <div class="steps" id="lowtom"></div>
        </div>

        <div class="track">
            <span>High Tom</span>
            <div class="steps" id="hightom"></div>
        </div>

        <div class="track">
            <span>Crash</span>
            <div class="steps" id="crash"></div>
        </div>

        <div class="track">
            <span>Ride</span>
            <div class="steps" id="ride"></div>
        </div>

        <div class="track">
            <span>Perc</span>
            <div class="steps" id="perc"></div>
        </div>


        <h2 class="section-title">🎹 INSTRUMENTS</h2>

        <div class="track">
            <span>Bass</span>
            <div class="steps" id="bass"></div>
        </div>

        <div class="track">
            <span>Piano</span>
            <div class="steps" id="piano"></div>
        </div>

        <div class="track">
            <span>Synth</span>
            <div class="steps" id="synth"></div>
        </div>

        <div class="track">
            <span>Lead</span>
            <div class="steps" id="lead"></div>
        </div>

    </section>

    <footer>
        <p>Made with 🎵 by You</p>
    </footer>

</div>

<script src="script.js"></script>

</body>
</html>
